name: Build and publish cloud mask

on:
  schedule:
    # Three attempts per UTC day, not because the underlying VIIRS data
    # changes more than once a day (it doesn't -- see run_pipeline.py), but
    # because GitHub's own scheduler does not fire `cron` triggers reliably
    # close to the requested minute -- confirmed 2026-09-14: a job scheduled
    # for 04:00 UTC actually ran at 09:35 UTC, a ~5.5h delay, with no fixed/
    # predictable offset. Multiple independent daily windows hedge against
    # any single one slipping or silently not firing; whichever fires first
    # each day publishes that day's data, and the later ones are then cheap
    # no-op-ish re-runs of the same day's already-current mask (harmless,
    # just a redundant publish). The pipeline's own coverage-based fallback
    # in run_pipeline.py separately handles the case where a day's satellite
    # data itself isn't fully published yet, regardless of when this fires.
    - cron: "0 0 * * *"
    - cron: "0 1 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: |
          python pipeline/run_pipeline.py \
            --width 4096 \
            --out output/latest \
            --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: output/latest
          keep_files: false
