name: Build and publish cloud mask

on:
  schedule:
    # Once daily, ~01:00 UTC. GitHub's own scheduler does not fire `cron`
    # triggers at the exact requested minute -- confirmed 2026-09-14: a job
    # scheduled for 04:00 UTC actually ran at 09:35 UTC, a ~5.5h delay, with
    # no fixed/predictable offset. Since the delay itself is unpredictable
    # either way, there's no minute-level scheduling to protect here; this
    # just needs to be early enough in the UTC day that even a multi-hour
    # GitHub-side delay still lands before the pipeline is next needed.
    # (The pipeline's own coverage-based fallback in run_pipeline.py already
    # separately handles the case where the requested day's satellite data
    # itself isn't fully published yet, regardless of when this fires.)
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: |
          python pipeline/run_pipeline.py \
            --width 4096 \
            --out output/latest \
            --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: output/latest
          keep_files: false
